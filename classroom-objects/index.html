<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom Objects</title>
<style>
  :root {
    --bg: #fff8e7;
    --card: #ffffff;
    --ink: #2b2d42;
    --muted: #6b6f85;
    --line: #e4dcc6;
    --accent: #3a86ff;
    --good: #2fbf71;
    --good-bg: #d9f7e6;
    --bad: #e5484d;
    --bad-bg: #fde3e4;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 28px;
  }
  h1 { margin: 0; font-size: clamp(22px, 3vw, 38px); }
  .tabs { display: flex; gap: 10px; }
  .tab {
    font: inherit;
    font-size: clamp(16px, 1.8vw, 24px);
    padding: 8px 20px;
    border-radius: 999px;
    border: 3px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab:disabled { opacity: .45; cursor: default; }
  .score { font-size: clamp(18px, 2.2vw, 30px); font-weight: bold; white-space: nowrap; }

  .progress { height: 12px; margin: 0 28px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }

  main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    padding: 20px 28px 28px;
    align-items: stretch;
  }
  .picture {
    background: var(--card);
    border: 4px solid var(--line);
    border-radius: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 0;
  }
  .picture svg { width: 100%; height: 100%; max-height: 62vh; }

  .quiz { display: flex; flex-direction: column; justify-content: center; gap: 20px; min-height: 0; }
  .question { font-size: clamp(34px, 5.5vw, 80px); font-weight: bold; margin: 0 0 6px; }
  .options { display: flex; flex-direction: column; gap: 18px; }
  .option {
    font: inherit;
    font-size: clamp(26px, 4vw, 56px);
    display: flex;
    align-items: center;
    gap: 22px;
    text-align: left;
    padding: 16px 26px;
    border-radius: 24px;
    border: 4px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    transition: transform .08s, background .15s, border-color .15s;
  }
  .option:active { transform: scale(.98); }
  .option .letter {
    flex: none;
    width: 1.5em; height: 1.5em;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--bg);
    border: 3px solid var(--line);
    font-weight: bold;
  }
  .option.correct { background: var(--good-bg); border-color: var(--good); }
  .option.correct .letter { background: var(--good); border-color: var(--good); color: #fff; }
  .option.wrong { background: var(--bad-bg); border-color: var(--bad); animation: shake .35s; }
  .option.wrong .letter { background: var(--bad); border-color: var(--bad); color: #fff; }
  .options.locked .option:not(.correct):not(.wrong) { opacity: .55; }
  @keyframes shake {
    25% { transform: translateX(-10px); } 75% { transform: translateX(10px); }
  }

  .next {
    align-self: flex-start;
    font: inherit;
    font-size: clamp(22px, 3vw, 40px);
    padding: 12px 36px;
    border-radius: 999px;
    border: 0;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    visibility: hidden;
  }
  .next.show { visibility: visible; }

  .done { grid-column: 1 / -1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; }
  .done h2 { font-size: clamp(36px, 6vw, 84px); margin: 0; }
  .done p { font-size: clamp(24px, 3.5vw, 48px); margin: 0; }
  .done .stars { font-size: clamp(40px, 7vw, 100px); }
  body.finished main > :not(.done) { display: none; }
  body.finished .done { display: flex; }

  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; overflow: auto; }
    .picture svg { max-height: 34vh; }
  }
  @media (prefers-reduced-motion: reduce) { .option.wrong { animation: none; } }
</style>
</head>
<body>
<header>
  <h1>Classroom Objects</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true">Activity 1 · What is it?</button>
    <button class="tab" role="tab" aria-selected="false" disabled title="Coming soon">Activity 2 · Is it …?</button>
  </div>
  <div class="score" id="score">⭐ 0 / 8</div>
</header>
<div class="progress"><div id="bar"></div></div>

<main>
  <div class="picture" id="picture" aria-live="polite"></div>
  <section class="quiz">
    <p class="question">What is it?</p>
    <div class="options" id="options"></div>
    <button class="next" id="next">Next ➜</button>
  </section>
  <section class="done">
    <div class="stars" id="stars"></div>
    <h2>Well done!</h2>
    <p id="final"></p>
    <button class="next show" id="again">Play again</button>
  </section>
</main>

<script>
(function () {
  // Simple hand-drawn pictures, so the page works offline on the smartboard.
  var W = 'stroke="#2b2d42" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
  var ITEMS = [
    { name: 'desk', article: 'a', svg:
      '<rect x="22" y="58" width="156" height="16" rx="3" fill="#c98a4b" ' + W + '/>' +
      '<rect x="34" y="74" width="8" height="70" fill="#a9703a" ' + W + '/>' +
      '<rect x="158" y="74" width="8" height="70" fill="#a9703a" ' + W + '/>' +
      '<rect x="42" y="96" width="116" height="10" fill="#a9703a" ' + W + '/>' },
    { name: 'chair', article: 'a', svg:
      '<rect x="62" y="16" width="76" height="62" rx="6" fill="#d9a066" ' + W + '/>' +
      '<line x1="82" y1="22" x2="82" y2="74" ' + W + '/><line x1="100" y1="22" x2="100" y2="74" ' + W + '/><line x1="118" y1="22" x2="118" y2="74" ' + W + '/>' +
      '<rect x="48" y="84" width="104" height="16" rx="4" fill="#c98a4b" ' + W + '/>' +
      '<line x1="58" y1="100" x2="52" y2="148" ' + W + '/><line x1="142" y1="100" x2="148" y2="148" ' + W + '/>' +
      '<line x1="72" y1="100" x2="76" y2="140" ' + W + '/><line x1="128" y1="100" x2="124" y2="140" ' + W + '/>' },
    { name: 'pencil', article: 'a', svg:
      '<g transform="rotate(-35 100 80)">' +
      '<rect x="24" y="66" width="22" height="28" rx="4" fill="#f4a6b8" ' + W + '/>' +
      '<rect x="44" y="66" width="8" height="28" fill="#b9bcc7" ' + W + '/>' +
      '<rect x="50" y="66" width="98" height="28" fill="#ffb627" ' + W + '/>' +
      '<polygon points="148,66 182,80 148,94" fill="#f6d8a8" ' + W + '/>' +
      '<polygon points="170,75 182,80 170,85" fill="#2b2d42" ' + W + '/>' +
      '</g>' },
    { name: 'pencil case', article: 'a', svg:
      '<g transform="rotate(-8 100 80)">' +
      '<line x1="62" y1="62" x2="52" y2="22" stroke="#e5484d" stroke-width="9" stroke-linecap="round"/>' +
      '<line x1="86" y1="62" x2="84" y2="18" stroke="#3a86ff" stroke-width="9" stroke-linecap="round"/>' +
      '<line x1="110" y1="62" x2="118" y2="22" stroke="#ffb627" stroke-width="9" stroke-linecap="round"/>' +
      '<rect x="22" y="58" width="156" height="68" rx="30" fill="#59c9a5" ' + W + '/>' +
      '<line x1="44" y1="92" x2="156" y2="92" stroke-dasharray="6 6" ' + W + '/>' +
      '<circle cx="160" cy="92" r="7" fill="#f4f1de" ' + W + '/>' +
      '</g>' },
    { name: 'book', article: 'a', svg:
      '<rect x="40" y="18" width="120" height="130" rx="6" fill="#d7263d" ' + W + '/>' +
      '<rect x="40" y="18" width="14" height="130" fill="#a31a2c" ' + W + '/>' +
      '<rect x="68" y="44" width="78" height="34" rx="4" fill="#fff" ' + W + '/>' +
      '<text x="107" y="68" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="22" font-weight="bold" fill="#2b2d42">Maths</text>' },
    { name: 'blackboard', article: 'a', svg:
      '<rect x="14" y="22" width="172" height="104" rx="6" fill="#c98a4b" ' + W + '/>' +
      '<rect x="26" y="34" width="148" height="80" fill="#2f3b3a" ' + W + '/>' +
      '<path d="M44 60 q12-14 24 0 t24 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/>' +
      '<line x1="44" y1="84" x2="120" y2="84" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/>' +
      '<rect x="14" y="126" width="172" height="10" rx="3" fill="#a9703a" ' + W + '/>' +
      '<rect x="130" y="119" width="22" height="7" rx="3" fill="#fff" ' + W + '/>' },
    { name: 'bookcase', article: 'a', svg:
      '<rect x="32" y="12" width="136" height="138" rx="4" fill="#c98a4b" ' + W + '/>' +
      '<rect x="42" y="22" width="116" height="118" fill="#8a5a2b" ' + W + '/>' +
      '<line x1="42" y1="62" x2="158" y2="62" ' + W + '/><line x1="42" y1="101" x2="158" y2="101" ' + W + '/>' +
      '<rect x="50" y="32" width="14" height="30" fill="#3a86ff"/><rect x="66" y="38" width="12" height="24" fill="#ffb627"/><rect x="80" y="30" width="16" height="32" fill="#59c9a5"/><rect x="112" y="36" width="14" height="26" fill="#d7263d"/>' +
      '<rect x="52" y="71" width="16" height="30" fill="#d7263d"/><rect x="70" y="77" width="12" height="24" fill="#3a86ff"/><rect x="100" y="70" width="14" height="31" fill="#ffb627"/><rect x="116" y="76" width="16" height="25" fill="#59c9a5"/>' +
      '<rect x="50" y="112" width="20" height="28" fill="#59c9a5"/><rect x="72" y="108" width="14" height="32" fill="#ffb627"/><rect x="120" y="114" width="14" height="26" fill="#3a86ff"/>' },
    { name: 'eraser', article: 'an', svg:
      '<g transform="rotate(-25 100 80)">' +
      '<rect x="36" y="52" width="128" height="56" rx="8" fill="#f4f1de" ' + W + '/>' +
      '<rect x="64" y="52" width="72" height="56" fill="#3a86ff" ' + W + '/>' +
      '<rect x="36" y="52" width="128" height="56" rx="8" fill="none" ' + W + '/>' +
      '</g>' }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var LETTERS = ['A', 'B', 'C'];
  var order, index, score, answered, triedWrong;

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  var audio;
  function beep(good) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      var notes = good ? [660, 880] : [220];
      notes.forEach(function (f, i) {
        var o = audio.createOscillator(), g = audio.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.value = 0.08;
        o.connect(g); g.connect(audio.destination);
        var t = audio.currentTime + i * 0.12;
        o.start(t); o.stop(t + 0.15);
      });
    } catch (e) { /* sound is optional */ }
  }

  function start() {
    order = shuffle(ITEMS);
    index = 0; score = 0;
    document.body.classList.remove('finished');
    render();
  }

  function render() {
    var item = order[index];
    answered = false; triedWrong = false;
    $('picture').innerHTML = '<svg viewBox="0 0 200 160" role="img" aria-label="classroom object">' + item.svg + '</svg>';
    $('score').textContent = '⭐ ' + score + ' / ' + ITEMS.length;
    $('bar').style.width = (index / ITEMS.length * 100) + '%';
    $('next').classList.remove('show');

    var wrongOnes = shuffle(ITEMS.filter(function (x) { return x !== item; })).slice(0, 2);
    var choices = shuffle([item].concat(wrongOnes));
    var box = $('options');
    box.className = 'options';
    box.innerHTML = '';
    choices.forEach(function (c, i) {
      var b = document.createElement('button');
      b.className = 'option';
      b.innerHTML = '<span class="letter">' + LETTERS[i] + '</span><span>' + c.article + ' ' + c.name + '</span>';
      b.addEventListener('click', function () { choose(b, c === item); });
      box.appendChild(b);
    });
  }

  function choose(btn, isRight) {
    if (answered || btn.classList.contains('wrong')) return;
    if (isRight) {
      answered = true;
      btn.classList.add('correct');
      $('options').classList.add('locked');
      if (!triedWrong) score++;
      $('score').textContent = '⭐ ' + score + ' / ' + ITEMS.length;
      $('next').textContent = index === ITEMS.length - 1 ? 'Finish ➜' : 'Next ➜';
      $('next').classList.add('show');
      beep(true);
    } else {
      triedWrong = true;
      btn.classList.add('wrong');
      beep(false);
    }
  }

  function finish() {
    $('bar').style.width = '100%';
    $('final').textContent = 'You got ' + score + ' out of ' + ITEMS.length + ' on the first try!';
    $('stars').textContent = score >= 7 ? '🌟🌟🌟' : score >= 4 ? '🌟🌟' : '🌟';
    document.body.classList.add('finished');
  }

  $('next').addEventListener('click', function () {
    if (index === ITEMS.length - 1) { finish(); } else { index++; render(); }
  });
  $('again').addEventListener('click', start);

  start();
})();
</script>
</body>
</html>
