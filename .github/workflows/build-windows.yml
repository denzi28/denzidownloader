name: Build Windows app
on:
  push:
    branches: [claude/social-media-video-downloader-evcsjt]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name DenziDownloader --add-data "static;static" --collect-all yt_dlp --collect-all imageio_ffmpeg app.py
      - uses: actions/upload-artifact@v4
        with:
          name: DenziDownloader-windows
          path: dist/DenziDownloader.exe
